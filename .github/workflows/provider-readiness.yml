name: provider-readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: provider-readiness
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-readiness
    env:
      NODE_ENV: production
      OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION }}
      OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${{ vars.OBJECT_STORAGE_FORCE_PATH_STYLE }}
      OBJECT_STORAGE_ENCRYPTION_MODE: ${{ vars.OBJECT_STORAGE_ENCRYPTION_MODE }}
      OBJECT_STORAGE_REQUIRE_VERSIONING: "true"
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      OBJECT_STORAGE_SESSION_TOKEN: ${{ secrets.OBJECT_STORAGE_SESSION_TOKEN }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      RUNTIME_IMAGE_REF: ${{ vars.RUNTIME_IMAGE_REF }}
      WEB_IMAGE_REF: ${{ vars.WEB_IMAGE_REF }}
      RELEASE_GIT_SHA: ${{ vars.RELEASE_GIT_SHA }}
      RELEASE_SIGNATURE_WORKFLOW: ${{ vars.RELEASE_SIGNATURE_WORKFLOW }}
      RELEASE_SIGNATURE_IDENTITY_REF: ${{ vars.RELEASE_SIGNATURE_IDENTITY_REF }}
      PDF_REGION_OCR_ENABLED: ${{ vars.PDF_REGION_OCR_ENABLED }}
      RECOVERY_MANIFEST_JSON: ${{ secrets.RECOVERY_MANIFEST_JSON }}
      RECOVERY_SIGNING_PUBLIC_KEY_PEM: ${{ secrets.RECOVERY_SIGNING_PUBLIC_KEY_PEM }}
      OBJECT_STORAGE_EVIDENCE_PATH: .tmp/provider-object-storage-evidence.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ vars.RELEASE_GIT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify exact candidate checkout and signed image digests
        run: npm run verify:release-checkout -- --candidate --verify-images
      - name: Reject ambiguous or missing provider credentials
        shell: bash
        run: |
          has_access_key=false
          has_secret_key=false
          test -z "$OBJECT_STORAGE_ACCESS_KEY" || has_access_key=true
          test -z "$OBJECT_STORAGE_SECRET_KEY" || has_secret_key=true
          if [[ "$has_access_key" != "$has_secret_key" ]]; then
            echo "Both object-storage access and secret keys are required together." >&2
            exit 1
          fi
          if [[ -n "$AWS_ROLE_ARN" && "$has_access_key" == "true" ]]; then
            echo "Choose AWS OIDC or explicit S3 credentials, not both." >&2
            exit 1
          fi
          if [[ -z "$AWS_ROLE_ARN" && "$has_access_key" == "false" ]]; then
            echo "Configure AWS_ROLE_ARN or explicit S3 credentials." >&2
            exit 1
          fi
          if [[ -n "$AWS_ROLE_ARN" && -z "$AWS_REGION" ]]; then
            echo "AWS_REGION is required with AWS_ROLE_ARN." >&2
            exit 1
          fi
      - name: Configure short-lived AWS credentials through GitHub OIDC
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: MotionPrepProviderReadiness-${{ github.run_id }}
      - name: Verify immutable release coordinates
        shell: bash
        run: |
          printf 'RELEASE_GIT_SHA=%s\nRUNTIME_IMAGE_REF=%s\nWEB_IMAGE_REF=%s\nRELEASE_SIGNATURE_WORKFLOW=%s\nRELEASE_SIGNATURE_IDENTITY_REF=%s\n' \
            "$RELEASE_GIT_SHA" "$RUNTIME_IMAGE_REF" "$WEB_IMAGE_REF" \
            "$RELEASE_SIGNATURE_WORKFLOW" "$RELEASE_SIGNATURE_IDENTITY_REF" \
            > provider-release.env
          node scripts/verify-release-environment.mjs provider-release.env --references-only
      - name: Probe the deployment-owned object store
        run: npm run verify:object-storage
      - name: Verify regional OCR release evidence when enabled
        if: ${{ vars.PDF_REGION_OCR_ENABLED == 'true' }}
        run: npm run verify:ocr-corpus
      - name: Verify the latest isolated restore evidence
        shell: bash
        run: |
          mkdir -p .tmp
          umask 077
          test -n "$RECOVERY_MANIFEST_JSON"
          test -n "$RECOVERY_SIGNING_PUBLIC_KEY_PEM"
          printf '%s' "$RECOVERY_MANIFEST_JSON" > recovery-manifest.json
          printf '%s' "$RECOVERY_SIGNING_PUBLIC_KEY_PEM" > recovery-public-key.pem
          node scripts/verify-recovery-manifest.mjs recovery-manifest.json \
            --public-key recovery-public-key.pem \
            --release-env provider-release.env \
            --evidence .tmp/recovery-verification-evidence.json
      - name: Remove raw recovery material
        if: always()
        shell: bash
        run: rm -f -- recovery-manifest.json recovery-public-key.pem
      - name: Publish readiness summary
        shell: bash
        run: |
          {
            echo "## Provider readiness gate"
            echo
            echo "- Immutable image references: verified"
            echo "- Exact untagged candidate checkout and protected-main Cosign identity: verified"
            echo "- Object storage write/read/integrity/delete probe: verified"
            echo "- Versioning requirement: verified by application readiness"
            echo "- Regional OCR evidence: $PDF_REGION_OCR_ENABLED"
            echo "- Character Rig external inference dependency: none"
            echo "- Latest RPO/RTO recovery manifest and Ed25519 signature: verified"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package visible, redacted, integrity-bound provider evidence
        run: >-
          node scripts/package-release-gate-evidence.mjs release-gate-evidence
          provider-release.env
          .tmp/provider-object-storage-evidence.json
          .tmp/recovery-verification-evidence.json
      - name: Retain provider and redacted recovery verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-readiness-evidence-${{ vars.RELEASE_GIT_SHA }}
          path: release-gate-evidence
          if-no-files-found: error
          retention-days: 90
