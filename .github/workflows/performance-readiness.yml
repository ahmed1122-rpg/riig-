name: performance-readiness

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Concurrent authenticated PDF workflows
        required: true
        default: "4"
      iterations:
        description: Iterations per concurrent user
        required: true
        default: "3"

permissions:
  contents: read

concurrency:
  group: performance-readiness
  cancel-in-progress: false

jobs:
  pdf-workflow-load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-readiness
    env:
      STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
      EXPECTED_APPLICATION_VERSION: ${{ vars.EXPECTED_APPLICATION_VERSION }}
      RELEASE_GIT_SHA: ${{ vars.RELEASE_GIT_SHA }}
      RUNTIME_IMAGE_REF: ${{ vars.RUNTIME_IMAGE_REF }}
      WEB_IMAGE_REF: ${{ vars.WEB_IMAGE_REF }}
      STAGING_EVIDENCE_PATH: .tmp/performance-release-evidence.json
      LOAD_TARGET_ORIGIN: ${{ vars.STAGING_ORIGIN }}
      LOAD_EXPECTED_HOST: ${{ vars.STAGING_HOST }}
      LOAD_CONCURRENCY: ${{ inputs.concurrency }}
      LOAD_ITERATIONS: ${{ inputs.iterations }}
      LOAD_MIN_CONCURRENCY: "4"
      LOAD_MIN_TOTAL_JOURNEYS: "12"
      LOAD_MAX_ERROR_RATE: "0"
      LOAD_MAX_WORKFLOW_P95_MS: ${{ vars.LOAD_MAX_WORKFLOW_P95_MS }}
      LOAD_MAX_API_RSS_GROWTH_BYTES: ${{ vars.LOAD_MAX_API_RSS_GROWTH_BYTES }}
      LOAD_MAX_WORKER_RSS_GROWTH_BYTES: ${{ vars.LOAD_MAX_WORKER_RSS_GROWTH_BYTES }}
      LOAD_MAX_QUEUE_AGE_SECONDS: ${{ vars.LOAD_MAX_QUEUE_AGE_SECONDS }}
      LOAD_MAX_FINAL_QUEUE_DEPTH: "0"
      LOAD_METRICS_SAMPLE_INTERVAL_MS: "2000"
      LOAD_PDF_PATH: .tmp/representative-load.pdf
      REPRESENTATIVE_PDF_URL: ${{ secrets.REPRESENTATIVE_PDF_URL }}
      REPRESENTATIVE_PDF_SHA256: ${{ vars.REPRESENTATIVE_PDF_SHA256 }}
      REPRESENTATIVE_PDF_MIN_BYTES: ${{ vars.REPRESENTATIVE_PDF_MIN_BYTES }}
      LOAD_METRICS_URL: ${{ vars.STAGING_METRICS_URL }}
      LOAD_METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
      LOAD_REQUIRE_METRICS: "true"
      LOAD_REPORT_PATH: .tmp/pdf-load-report.json
      LOAD_REQUIRE_RELEASE_IDENTITY: "true"
      LOAD_RELEASE_GIT_SHA: ${{ vars.RELEASE_GIT_SHA }}
      LOAD_EXPECTED_APPLICATION_VERSION: ${{ vars.EXPECTED_APPLICATION_VERSION }}
      LOAD_RUNTIME_IMAGE_REF: ${{ vars.RUNTIME_IMAGE_REF }}
      LOAD_WEB_IMAGE_REF: ${{ vars.WEB_IMAGE_REF }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify deployed release identity before the load run
        run: npm run verify:staging-application
      - name: Fetch and verify the protected representative PDF
        run: npm run fetch:representative-pdf
      - name: Require explicit representative-load policy
        shell: bash
        run: |
          test -f "$LOAD_PDF_PATH" || { echo "Representative PDF fixture is unavailable"; exit 1; }
          test -n "$LOAD_MAX_WORKFLOW_P95_MS" || { echo "LOAD_MAX_WORKFLOW_P95_MS is required"; exit 1; }
          test -n "$LOAD_MAX_API_RSS_GROWTH_BYTES" || { echo "LOAD_MAX_API_RSS_GROWTH_BYTES is required"; exit 1; }
          test -n "$LOAD_MAX_WORKER_RSS_GROWTH_BYTES" || { echo "LOAD_MAX_WORKER_RSS_GROWTH_BYTES is required"; exit 1; }
          test -n "$LOAD_MAX_QUEUE_AGE_SECONDS" || { echo "LOAD_MAX_QUEUE_AGE_SECONDS is required"; exit 1; }
          test -n "$LOAD_METRICS_URL" || { echo "STAGING_METRICS_URL is required"; exit 1; }
          test -n "$LOAD_METRICS_BEARER_TOKEN" || { echo "METRICS_BEARER_TOKEN is required"; exit 1; }
      - name: Run concurrent PDF upload, processing, export, and download
        run: npm run test:load:pdf
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf-load-evidence-${{ github.sha }}
          path: |
            .tmp/performance-release-evidence.json
            .tmp/pdf-load-report.json
          if-no-files-found: error
          retention-days: 90
