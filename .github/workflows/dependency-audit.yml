name: dependency-audit

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  all-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reject known high or critical dependency vulnerabilities
        run: npm run verify:dependency-audit
      - name: Escalate a failed scheduled dependency audit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          title="Dependency audit failure on ${GITHUB_SHA}"
          existing="$(gh issue list --state open --search 'Dependency audit failure in:title' --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "$title" \
              --body "The scheduled dependency security gate failed. Inspect workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
