name: dependency-audit

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  all-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reject known high or critical dependency vulnerabilities
        run: npm run verify:dependency-audit
      - name: Record private escalation instructions
        if: failure()
        shell: bash
        run: |
          {
            echo "## Dependency security gate failed"
            echo
            echo "Do not open a public issue. The security owner must inspect this protected workflow run and coordinate remediation through the repository's private vulnerability-reporting channel."
          } >> "$GITHUB_STEP_SUMMARY"
