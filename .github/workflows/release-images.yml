name: release-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: motionprep
          POSTGRES_USER: motionprep
          POSTGRES_PASSWORD: motionprep-integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motionprep -d motionprep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://motionprep:motionprep-integration@127.0.0.1:5432/motionprep
      INTEGRATION_DATABASE_URL: postgresql://motionprep:motionprep-integration@127.0.0.1:5432/motionprep
      INTEGRATION_S3_ENDPOINT: http://127.0.0.1:9000
      INTEGRATION_S3_BUCKET: motionprep-integration
      INTEGRATION_S3_ACCESS_KEY: motionprep
      INTEGRATION_S3_SECRET_KEY: motionprep-integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prove the checkout is the immutable release SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Re-run the complete source quality gate on the release SHA
        run: npm run quality
      - name: Validate and exercise Prometheus alert rules
        run: npm run verify:alerts
      - run: npm audit --omit=dev --audit-level=high
      - name: Re-run browser journeys on the release SHA
        run: |
          npm run test:e2e:install
          npm run test:e2e
      - name: Start pinned object storage for durable integration
        shell: bash
        run: |
          docker run --detach --name motionprep-minio-release \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$INTEGRATION_S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$INTEGRATION_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          timeout 60 bash -c \
            'until curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; do sleep 2; done'
      - name: Re-run durable persistence and object-storage tests on the release SHA
        run: |
          node scripts/verify-concurrent-migrations.mjs
          npm run test:integration --workspace @motionprep/api
      - name: Stop release integration object storage
        if: always()
        run: docker rm --force motionprep-minio-release || true
      - name: Verify the production-shaped topology on the release SHA
        run: npm run test:topology:full
      - name: Retain exact-SHA topology and fault evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-evidence-${{ github.sha }}
          path: |
            .tmp/topology-pdf-load-report.json
            .tmp/fault-recovery-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload exact-SHA failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.sha }}
          path: |
            artifacts/playwright
            artifacts/playwright-report
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve immutable image coordinates
        id: coordinates
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "runtime=ghcr.io/${owner}/motionprep-runtime" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/motionprep-web" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime image
        id: runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.coordinates.outputs.runtime }}:${{ steps.coordinates.outputs.tag }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
          provenance: mode=max
          sbom: true

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.coordinates.outputs.web }}:${{ steps.coordinates.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true

      - name: Prove clean-runner pull and hardened web smoke
        env:
          RUNTIME_REF: ${{ steps.coordinates.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
          WEB_REF: ${{ steps.coordinates.outputs.web }}@${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          docker pull "${RUNTIME_REF}"
          docker pull "${WEB_REF}"
          test "$(docker image inspect "${RUNTIME_REF}" --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect "${WEB_REF}" --format '{{.Config.User}}')" = "nginx"
          docker run --detach --name motionprep-release-web \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --add-host api:127.0.0.1 \
            --tmpfs /var/cache/nginx:rw,size=32m,mode=1777 \
            --tmpfs /var/run:rw,size=1m,mode=1777 \
            --tmpfs /tmp:rw,size=16m \
            --publish 18080:8080 \
            "${WEB_REF}"
          timeout 30 bash -c \
            'until curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; do sleep 1; done'

      - name: Scan published runtime digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.coordinates.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan published web digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.coordinates.outputs.web }}@${{ steps.web.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign approved immutable image digests
        env:
          RUNTIME_REF: ${{ steps.coordinates.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
          WEB_REF: ${{ steps.coordinates.outputs.web }}@${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          cosign sign --yes "${RUNTIME_REF}"
          cosign sign --yes "${WEB_REF}"

      - name: Verify repository-bound signatures
        env:
          RUNTIME_REF: ${{ steps.coordinates.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
          WEB_REF: ${{ steps.coordinates.outputs.web }}@${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-images.yml@${GITHUB_REF}"
          for image in "${RUNTIME_REF}" "${WEB_REF}"; do
            cosign verify \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${image}"
          done

      - name: Write immutable deployment manifest
        env:
          RUNTIME_IMAGE_REF: ${{ steps.coordinates.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
          WEB_IMAGE_REF: ${{ steps.coordinates.outputs.web }}@${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          {
            echo "RUNTIME_IMAGE_REF=${RUNTIME_IMAGE_REF}"
            echo "WEB_IMAGE_REF=${WEB_IMAGE_REF}"
            echo "RELEASE_GIT_SHA=${GITHUB_SHA}"
          } > release.env

      - name: Write machine-readable release evidence bundle
        env:
          RUNTIME_IMAGE_REF: ${{ steps.coordinates.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
          WEB_IMAGE_REF: ${{ steps.coordinates.outputs.web }}@${{ steps.web.outputs.digest }}
        run: node scripts/create-release-evidence.mjs release-evidence.json

      - name: Download exact-SHA topology and fault evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source-evidence-${{ github.sha }}
          path: release-source-evidence

      - name: Upload immutable deployment manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            release.env
            release-evidence.json
            release-source-evidence/topology-pdf-load-report.json
            release-source-evidence/fault-recovery-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish deployment coordinates
        env:
          RUNTIME_IMAGE_REF: ${{ steps.coordinates.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
          WEB_IMAGE_REF: ${{ steps.coordinates.outputs.web }}@${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          {
            echo "## Immutable release images"
            echo
            echo '```dotenv'
            echo "RUNTIME_IMAGE_REF=${RUNTIME_IMAGE_REF}"
            echo "WEB_IMAGE_REF=${WEB_IMAGE_REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
