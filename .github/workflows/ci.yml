name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.qa
          push: false
          load: true
          tags: motionprep-qa:ci
          cache-from: type=gha,scope=qa
          cache-to: type=gha,mode=max,scope=qa
      - name: Prepare QA evidence directory
        run: mkdir -p artifacts/qa
      - name: Verify staging dependency probes in the QA image
        run: >-
          docker run --rm motionprep-qa:ci
          npm run verify:staging-dependencies:test --workspace @motionprep/api
      - name: Run the complete source quality gate in the QA image
        run: >-
          docker run --rm
          --env GITHUB_SHA
          --volume "${GITHUB_WORKSPACE}/artifacts/qa:/workspace/artifacts/qa"
          motionprep-qa:ci
      - name: Audit the complete dependency tree in the QA image
        run: docker run --rm motionprep-qa:ci npm run verify:dependency-audit
      - name: Upload QA execution summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-source-evidence-${{ github.sha }}
          path: artifacts/qa/quality-summary.json
          if-no-files-found: error
          retention-days: 14

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate and exercise Prometheus alert rules
        run: npm run verify:alerts
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: motionprep-runtime:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          load: true
          tags: motionprep-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Verify non-root image users
        shell: bash
        run: |
          test "$(docker image inspect motionprep-runtime:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect motionprep-web:ci --format '{{.Config.User}}')" = "nginx"
      - name: Smoke hardened web image
        shell: bash
        run: |
          docker run --detach --name motionprep-web-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --add-host api:127.0.0.1 \
            --env TRUSTED_PROXY_CIDR=127.0.0.1/32 \
            --tmpfs /etc/nginx/conf.d:rw,size=1m,mode=1777 \
            --tmpfs /var/cache/nginx:rw,size=32m,mode=1777 \
            --tmpfs /var/run:rw,size=1m,mode=1777 \
            --tmpfs /tmp:rw,size=16m \
            --publish 18080:8080 \
            motionprep-web:ci
          timeout 30 bash -c \
            'until curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; do sleep 1; done'
      - name: Reject an invalid trusted proxy before Nginx starts
        shell: bash
        run: |
          if docker run --rm \
            --env TRUSTED_PROXY_CIDR=invalid \
            motionprep-web:ci; then
            echo "Web image accepted an invalid trusted proxy CIDR." >&2
            exit 1
          fi
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: motionprep-runtime:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan web image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: motionprep-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Prepare container security evidence
        run: mkdir -p artifacts/security
      - name: Capture all runtime findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: motionprep-runtime:ci
          format: json
          output: artifacts/security/runtime-trivy.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Capture all web findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: motionprep-web:ci
          format: json
          output: artifacts/security/web-trivy.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Reject unapproved unfixed container findings
        run: >-
          node scripts/verify-trivy-exceptions.mjs
          runtime=artifacts/security/runtime-trivy.json
          web=artifacts/security/web-trivy.json
      - name: Retain container security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-${{ github.sha }}
          path: artifacts/security
          if-no-files-found: ignore
          retention-days: 30

  release-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run fixtures:generate
      - run: npm run verify:fixtures
      - run: npm run benchmark:ocr
      - run: npm run verify:adobe-golden
      - name: Ensure deterministic fixtures remain unchanged
        run: git diff --exit-code -- artifacts/fixtures assets/manifests/corpus.json
      - name: Upload release validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-fixture-evidence
          path: |
            artifacts/adobe-golden
            artifacts/benchmarks/ocr-arabic
          if-no-files-found: error
          retention-days: 14
  durable-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: motionprep
          POSTGRES_USER: motionprep
          POSTGRES_PASSWORD: motionprep-integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motionprep -d motionprep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://motionprep:motionprep-integration@127.0.0.1:5432/motionprep
      INTEGRATION_DATABASE_URL: postgresql://motionprep:motionprep-integration@127.0.0.1:5432/motionprep
      INTEGRATION_S3_ENDPOINT: http://127.0.0.1:9000
      INTEGRATION_S3_BUCKET: motionprep-integration
      INTEGRATION_S3_ACCESS_KEY: motionprep
      INTEGRATION_S3_SECRET_KEY: motionprep-integration
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Start pinned MinIO
        run: |
          docker run --detach --name motionprep-minio-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$INTEGRATION_S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$INTEGRATION_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          timeout 60 bash -c \
            'until curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; do sleep 2; done'
      - name: Prove concurrent migration safety and idempotency
        run: node scripts/verify-concurrent-migrations.mjs
      - run: npm run test:integration --workspace @motionprep/api
      - name: Repeat Character lease and idempotency race tests
        run: |
          npm run test:character-rig:race --workspace @motionprep/api
          npm run test:character-rig:race --workspace @motionprep/api
          npm run test:character-rig:race --workspace @motionprep/api
      - name: Print MinIO logs after failure
        if: failure()
        run: docker logs motionprep-minio-ci

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify pinned Playwright runtime
        run: |
          test -d /ms-playwright
          npx playwright --version
      - run: npm run test:e2e:${{ matrix.engine }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence-${{ matrix.engine }}
          path: |
            artifacts/playwright
            artifacts/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  production-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Start the production-shaped integration topology
        run: docker compose -f compose.integration.yaml up --detach --build --wait
      - run: npm run test:topology
      - name: Prove dependency outages fail closed and recover
        run: npm run test:faults:topology
      - name: Run concurrent PDF workflow smoke load
        env:
          LOAD_CONCURRENCY: "2"
          LOAD_ITERATIONS: "1"
          LOAD_REQUEST_ORIGIN: http://127.0.0.1:5173
          LOAD_METRICS_URL: http://127.0.0.1:54101/internal/metrics
          LOAD_METRICS_BEARER_TOKEN: metrics-integration-token-at-least-32-characters
          LOAD_REPORT_PATH: .tmp/topology-pdf-load-report.json
        run: npm run test:load:pdf
      - name: Capture topology diagnostics
        if: always()
        run: |
          docker compose -f compose.integration.yaml ps
          docker compose -f compose.integration.yaml logs --no-color > topology.log
      - name: Upload topology evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-topology-evidence
          path: |
            topology.log
            .tmp/topology-pdf-load-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop topology
        if: always()
        run: docker compose -f compose.integration.yaml down --volumes
