name: staging-application-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-application-readiness
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-readiness
    env:
      STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
      EXPECTED_APPLICATION_VERSION: ${{ vars.EXPECTED_APPLICATION_VERSION }}
      RELEASE_GIT_SHA: ${{ vars.RELEASE_GIT_SHA }}
      RELEASE_TAG: ${{ vars.RELEASE_TAG }}
      RUNTIME_IMAGE_REF: ${{ vars.RUNTIME_IMAGE_REF }}
      WEB_IMAGE_REF: ${{ vars.WEB_IMAGE_REF }}
      STAGING_EVIDENCE_PATH: .tmp/staging-application-evidence.json
      LOAD_TARGET_ORIGIN: ${{ vars.STAGING_ORIGIN }}
      LOAD_EXPECTED_HOST: ${{ vars.STAGING_HOST }}
      LOAD_CONCURRENCY: "1"
      LOAD_ITERATIONS: "1"
      LOAD_MAX_ERROR_RATE: "0"
      LOAD_REPORT_PATH: .tmp/staging-smoke-pdf-report.json
      LOAD_REQUIRE_RELEASE_IDENTITY: "true"
      LOAD_RELEASE_GIT_SHA: ${{ vars.RELEASE_GIT_SHA }}
      LOAD_EXPECTED_APPLICATION_VERSION: ${{ vars.EXPECTED_APPLICATION_VERSION }}
      LOAD_RUNTIME_IMAGE_REF: ${{ vars.RUNTIME_IMAGE_REF }}
      LOAD_WEB_IMAGE_REF: ${{ vars.WEB_IMAGE_REF }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ vars.RELEASE_GIT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify exact checkout, tag, and signed image digests
        run: npm run verify:release-checkout -- --verify-images
      - name: Verify public health, release identity, and capability contract
        run: npm run verify:staging-application
      - name: Complete authenticated PDF upload, process, export, and download
        run: npm run test:load:pdf
      - name: Retain staging application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-application-evidence-${{ github.sha }}
          path: |
            .tmp/staging-application-evidence.json
            .tmp/staging-smoke-pdf-report.json
          if-no-files-found: error
          retention-days: 90
