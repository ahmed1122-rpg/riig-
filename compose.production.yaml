name: motionprep

x-runtime: &runtime
  image: ${RUNTIME_IMAGE_REF:?Set RUNTIME_IMAGE_REF to an immutable registry digest}
  environment:
    # The signed release manifest is authoritative; workers and API expose this
    # revision in health, logs, heartbeats, and metrics.
    RELEASE_VERSION: ${RELEASE_GIT_SHA:?Set RELEASE_GIT_SHA from the signed release manifest}
    WORKER_HEALTH_INSTANCE_FILE: /tmp/motionprep-worker-instance-id
  networks:
    - application
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  restart: unless-stopped
  pids_limit: ${RUNTIME_PIDS_LIMIT:-256}
  # Worker drain defaults to 30s; leave a margin for lease requeue and cleanup.
  stop_grace_period: 45s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    <<: *runtime
    env_file:
      - ${MOTIONPREP_MIGRATION_ENV_FILE:?Set MOTIONPREP_MIGRATION_ENV_FILE to the dedicated migration secret file}
    command:
      - node
      - --conditions=production
      - apps/api/dist/infrastructure/postgres/migrate.js
    restart: "no"

  maintenance:
    <<: *runtime
    env_file:
      - ${MOTIONPREP_MAINTENANCE_ENV_FILE:?Set MOTIONPREP_MAINTENANCE_ENV_FILE to the maintenance secret file}
    command:
      - node
      - --conditions=production
      - apps/api/dist/maintenance/run-retention-cleanup.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - maintenance
    restart: "no"
    mem_limit: ${MAINTENANCE_MEMORY_LIMIT:-384m}
    cpus: ${MAINTENANCE_CPU_LIMIT:-0.5}

  maintenance-scheduler:
    <<: *runtime
    env_file:
      - ${MOTIONPREP_MAINTENANCE_ENV_FILE:?Set MOTIONPREP_MAINTENANCE_ENV_FILE to the maintenance secret file}
    command:
      - node
      - --conditions=production
      - apps/api/dist/maintenance/run-retention-scheduler.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: ${MAINTENANCE_MEMORY_LIMIT:-384m}
    cpus: ${MAINTENANCE_CPU_LIMIT:-0.5}

  api:
    <<: *runtime
    # 10s readiness deregistration + up to 120s for an accepted proxy request,
    # with a final margin before Compose sends SIGKILL.
    stop_grace_period: 140s
    env_file:
      - ${MOTIONPREP_API_ENV_FILE:?Set MOTIONPREP_API_ENV_FILE to the API secret file}
    command:
      - node
      - --conditions=production
      - apps/api/dist/server.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    cpus: ${API_CPU_LIMIT:-1.0}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker-media:
    <<: *runtime
    env_file:
      - ${MOTIONPREP_MEDIA_WORKER_ENV_FILE:?Set MOTIONPREP_MEDIA_WORKER_ENV_FILE to the media-worker secret file}
    command:
      - node
      - --conditions=production
      - apps/worker-media/dist/index.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: ${MEDIA_MEMORY_LIMIT:-2g}
    cpus: ${MEDIA_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker-health.mjs", "media"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker-security:
    <<: *runtime
    env_file:
      - ${MOTIONPREP_SECURITY_WORKER_ENV_FILE:?Set MOTIONPREP_SECURITY_WORKER_ENV_FILE to the security-worker secret file}
    command:
      - node
      - --conditions=production
      - apps/worker-security/dist/index.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: ${SECURITY_MEMORY_LIMIT:-512m}
    cpus: ${SECURITY_CPU_LIMIT:-1.0}
    # Allow an in-flight bounded scanner request to settle or release its lease.
    stop_grace_period: 140s
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker-health.mjs", "security"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker-document:
    <<: *runtime
    env_file:
      - ${MOTIONPREP_DOCUMENT_WORKER_ENV_FILE:?Set MOTIONPREP_DOCUMENT_WORKER_ENV_FILE to the document-worker secret file}
    command:
      - node
      - --conditions=production
      - apps/worker-document/dist/index.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: ${DOCUMENT_MEMORY_LIMIT:-2g}
    cpus: ${DOCUMENT_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker-health.mjs", "document"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker-export:
    <<: *runtime
    env_file:
      - ${MOTIONPREP_EXPORT_WORKER_ENV_FILE:?Set MOTIONPREP_EXPORT_WORKER_ENV_FILE to the export-worker secret file}
    command:
      - node
      - --conditions=production
      - apps/worker-export/dist/index.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: ${EXPORT_MEMORY_LIMIT:-2g}
    cpus: ${EXPORT_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker-health.mjs", "export"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker-character:
    <<: *runtime
    env_file:
      - ${MOTIONPREP_CHARACTER_WORKER_ENV_FILE:?Set MOTIONPREP_CHARACTER_WORKER_ENV_FILE to the character-worker secret file}
    profiles:
      - character-rig
    command:
      - node
      - --conditions=production
      - apps/worker-character/dist/index.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: ${CHARACTER_MEMORY_LIMIT:-2g}
    cpus: ${CHARACTER_CPU_LIMIT:-2.0}
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker-health.mjs", "character"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    image: ${WEB_IMAGE_REF:?Set WEB_IMAGE_REF to an immutable registry digest}
    environment:
      # Source CIDR of the immediate TLS load balancer, never a public-client range.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:?Set TRUSTED_PROXY_CIDR to the immediate load balancer source CIDR}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - application
    init: true
    read_only: true
    pids_limit: ${WEB_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=1m,mode=1777
      - /tmp:size=16m
    ports:
      - "${WEB_PORT:-8080}:8080"
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    cpus: ${WEB_CPU_LIMIT:-0.5}
    restart: unless-stopped
    # Dockerfile.web owns the /healthz image healthcheck. Compose deliberately
    # inherits it so local, staging, and production use the same probe.

networks:
  application:
    driver: bridge
