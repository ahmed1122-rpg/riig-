geo $realip_remote_addr $motionprep_trusted_proxy {
  default 0;
  ${TRUSTED_PROXY_CIDR} 1;
}

map "$motionprep_trusted_proxy:$http_x_forwarded_proto" $motionprep_forwarded_proto {
  default $scheme;
  "1:http" http;
  "1:https" https;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 30m;

  # Only the immediate TLS load balancer may supply forwarded client metadata.
  # real_ip_recursive selects the nearest untrusted address, so a spoofed
  # left-hand X-Forwarded-For value cannot become the application client IP.
  set_real_ip_from ${TRUSTED_PROXY_CIDR};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;
  gzip_vary on;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Load-balancer readiness follows the API dependency and release-identity
  # contract. Keep /healthz as a process-only liveness probe.
  location = /readyz {
    access_log off;
    proxy_pass http://api:4000/v1/health/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $motionprep_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }

  location /v1/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Collapse the trusted edge chain to one sanitized hop for Fastify.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $motionprep_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    # Defining Cache-Control here stops normal add_header inheritance, so the
    # security header contract must be included again in this location.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}
