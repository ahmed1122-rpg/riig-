global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/motionprep-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: motionprep-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/motionprep_metrics_bearer_token
    static_configs:
      - targets:
          - api:4000

# Receiver credentials remain deployment-owned. Mount the receiver URL as a
# secret and start from deploy/alertmanager.example.yml; do not commit it.
