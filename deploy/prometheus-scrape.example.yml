global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/motionprep-alerts.yml

scrape_configs:
  - job_name: motionprep-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/motionprep_metrics_bearer_token
    static_configs:
      - targets:
          - api:4000

# Alertmanager routing is deployment-owned because receiver credentials and
# escalation policies differ by organization. Do not place webhook, SMTP, or
# paging credentials in this repository.
