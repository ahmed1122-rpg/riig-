groups:
  - name: motionprep-readiness
    rules:
      - alert: MotionPrepApiDown
        expr: up{job="motionprep-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MotionPrep API target is unavailable
          runbook: docs/runbooks/production-dependency-recovery.md

      - alert: MotionPrepApiMetricsAbsent
        expr: absent(motionprep_dependencies_ready)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MotionPrep API metrics are absent
          runbook: docs/runbooks/production-dependency-recovery.md

      - alert: MotionPrepDependencyUnavailable
        expr: motionprep_dependencies_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MotionPrep dependency readiness is failing
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepObjectStorageUnavailable
        expr: motionprep_dependency_ready{dependency="object_storage"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MotionPrep object storage readiness is failing
          runbook: docs/runbooks/production-dependency-recovery.md

      - alert: MotionPrepSmtpUnavailable
        expr: motionprep_dependency_ready{dependency="smtp"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: MotionPrep SMTP readiness is failing
          runbook: docs/runbooks/production-dependency-recovery.md

      - alert: MotionPrepOperationalMetricsUnavailable
        expr: motionprep_operational_snapshot_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MotionPrep cannot collect durable operational metrics
          runbook: docs/runbooks/production-dependency-recovery.md

      - alert: MotionPrepWorkerMissing
        expr: max by (worker_type) (motionprep_worker_up) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A required MotionPrep worker type has no healthy heartbeat
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepQueueTooOld
        expr: motionprep_queue_oldest_queued_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: MotionPrep queue age exceeds five minutes
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepLeaseLoss
        expr: motionprep_worker_events_last_hour{event="lease_lost"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A MotionPrep worker lost a job lease
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepRetryStorm
        expr: |
          sum by (queue) (
            motionprep_worker_events_last_hour{event="retry"}
          ) > 10
          and on (queue)
          (
            sum by (queue) (
              motionprep_worker_events_last_hour{event="retry"}
            )
            /
            clamp_min(
              sum by (queue) (
                motionprep_worker_events_last_hour{event=~"completed|failed"}
              ),
              1
            )
          ) > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: MotionPrep worker retries exceed the allowed ratio
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepTerminalJobFailuresHigh
        expr: |
          sum by (queue) (
            motionprep_worker_events_last_hour{event="failed"}
          ) > 5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: MotionPrep terminal job failures are elevated
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepEmailOutboxBacklog
        expr: motionprep_email_outbox_oldest_queued_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: MotionPrep email delivery backlog exceeds five minutes
          runbook: docs/runbooks/production-dependency-recovery.md

      - alert: MotionPrepEmailOutboxFailures
        expr: motionprep_email_outbox_events_last_hour{event="failed"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: MotionPrep email delivery reached terminal failure
          runbook: docs/runbooks/production-dependency-recovery.md

      - alert: MotionPrepRetentionMaintenanceOverdue
        expr: motionprep_maintenance_stale{task="retention"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Scheduled retention maintenance is missing or overdue
          runbook: docs/DEPLOYMENT.md

      - alert: MotionPrepUploadIntegrityFailure
        expr: increase(motionprep_upload_integrity_terminal_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A stored upload failed a terminal integrity check
          runbook: docs/runbooks/upload-export.md

      - alert: MotionPrepUploadReconciliationFailures
        expr: |
          increase(
            motionprep_upload_reconciliation_outcomes_total{
              outcome="transient"
            }[10m]
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Upload reconciliation is repeatedly failing transiently
          runbook: docs/runbooks/upload-export.md

      - alert: MotionPrepUploadReconciliationStalled
        expr: |
          motionprep_upload_reconciliation_last_run_timestamp_seconds > 0
          and
          time() - motionprep_upload_reconciliation_last_run_timestamp_seconds > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Upload reconciliation has not completed a run recently
          runbook: docs/runbooks/upload-export.md

      - alert: MotionPrepContainerMemoryPressure
        expr: |
          container_memory_working_set_bytes{container_label_com_docker_compose_project="motionprep"}
          /
          container_spec_memory_limit_bytes{container_label_com_docker_compose_project="motionprep"}
          > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A MotionPrep container exceeds 90% of its memory limit
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepContainerCpuSaturation
        expr: |
          rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_project="motionprep"}[5m])
          /
          container_spec_cpu_quota{container_label_com_docker_compose_project="motionprep"}
          * container_spec_cpu_period{container_label_com_docker_compose_project="motionprep"}
          > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A MotionPrep container is CPU-saturated
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepHttpErrorRateHigh
        expr: |
          sum(rate(motionprep_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(motionprep_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: MotionPrep HTTP 5xx ratio exceeds 5%
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepAuthenticationRejectionsHigh
        expr: |
          sum(
            rate(
              motionprep_http_requests_total{
                route=~"/v1/auth/.*",
                status=~"4.."
              }[5m]
            )
          ) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: MotionPrep authentication rejection rate is elevated
          runbook: docs/runbooks/production-dependency-recovery.md

      - alert: MotionPrepApiLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(motionprep_http_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: MotionPrep API p95 latency exceeds five seconds
          runbook: docs/runbooks/processing-job-recovery.md

      - alert: MotionPrepClientLcpSlow
        expr: |
          histogram_quantile(
            0.75,
            sum by (le) (rate(motionprep_client_lcp_seconds_bucket[15m]))
          ) > 2.5
          and
          sum(rate(motionprep_client_lcp_seconds_count[15m])) > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Browser-reported p75 LCP exceeds 2.5 seconds
          runbook: docs/runbooks/client-experience.md

      - alert: MotionPrepClientErrorsHigh
        expr: |
          sum(rate(motionprep_client_errors_total[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Sanitized browser error reports are elevated
          runbook: docs/runbooks/client-experience.md

      - alert: MotionPrepCspViolationDetected
        expr: |
          sum(increase(motionprep_csp_violations_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A browser reported a Content Security Policy violation
          runbook: docs/runbooks/client-experience.md
